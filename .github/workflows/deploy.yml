name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Collect public sources
        run: node scripts/collect.mjs
      - name: Preserve source snapshots and observed history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -I '"(generatedAt|lastSync|fetched_at|checkedAt)":' -- public/data/public-feed.json; then
            git add public/data/public-feed.json
            git commit -m "Refresh public Notability source snapshot [skip ci]"
            git push
          fi
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://rixxcrhrxbtyuoiywcgk.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_s0AaED1SxfCPe6-dypcuwA_GujcgH8u
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
