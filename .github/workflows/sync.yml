name: Scheduled Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_SYNC_URL != '' }}
    steps:
      - name: Trigger Supabase sync
        run: |
          curl --fail-with-body -sS --max-time 180 -X POST "$SUPABASE_SYNC_URL" \
            -H "apikey: $SUPABASE_SYNC_TOKEN" \
            -H "Authorization: Bearer $SUPABASE_SYNC_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"source":"all"}'
        env:
          SUPABASE_SYNC_URL: ${{ vars.SUPABASE_SYNC_URL }}
          SUPABASE_SYNC_TOKEN: ${{ secrets.SUPABASE_SYNC_TOKEN }}
